<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>野菜出荷管理 Ver1</title>
<style>

body{
margin:0;
padding:12px;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#f3f6fa;
color:#222;
}

.header{
background:#2e7d32;
color:#fff;
padding:15px;
border-radius:10px;
text-align:center;
margin-bottom:15px;
}

.subTitle{
margin:5px 0 0;
font-size:13px;
}

.menu{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:15px;
}

.menu button{

background:#43a047;
color:white;
border:none;
border-radius:8px;
padding:10px 16px;
font-size:15px;
white-space:nowrap;

}
/* 10キー */
#numPad{
    position:relative;

    width:520px;
    margin:15px 15px 20px auto;
    padding:8px;
    
display:flex;
align-items:center;
justify-content:center;
    
    background:#fff;
    border:2px solid #555;
    border-radius:12px;

    box-shadow:0 3px 12px rgba(0,0,0,.25);

    text-align:center;
}

#numPad .numRow{
    display:flex;
    justify-content:center;
}

#numPad .numKey{
    width:60px;
    height:55px;
    margin:3px;

    font-size:24px;
    font-weight:bold;

    border:1px solid #888;
    border-radius:8px;
    background:#f5f5f5;
}

#numPad .direction{
    background:#e8e8e8;
}
.tableWrap{

overflow:auto;
background:white;
border-radius:10px;
padding:10px;

box-shadow:0 2px 6px rgba(0,0,0,.1);

}

table{

border-collapse:collapse;
width:max-content;

}

th{

background:#4caf50;
color:white;
padding:8px;
border:1px solid #ddd;

}

td{

border:1px solid #ddd;
padding:5px;

}

input[type=number]{

width:55px;
padding:5px;
text-align:center;

}

footer{

margin-top:20px;

background:white;

padding:15px;

border-radius:10px;

font-size:22px;

font-weight:bold;

text-align:center;

box-shadow:0 2px 6px rgba(0,0,0,.1);

}
#printArea {

    visibility:hidden;

    position:absolute;

    left:0;

    top:0;

    width:100%;

}
    #numPad .enterKey{
    height:177px;
    width:70px;
    flex-shrink:0;
}
    #numPad .keyArea{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
}
    #numPad .directionArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-left:5px;
}

#numPad .directionArea > div{
    display:flex;
}

#numPad .directionArea .numKey{
    width:60px;
    height:55px;
}
    /* 数字・削除・Cキーを横に広げる */
#numPad .keyArea .numKey{
    width:90px;
}
    .dailyHistoryRow{
  display:flex;
  justify-content:space-between;
  width:300px;
  margin:4px 0;
}
    .dailyHistoryHeader{
  display:flex;
  justify-content:space-between;
  width:300px;
  margin-bottom:6px;
  font-weight:bold;
}
    #dailyTotal{
  font-weight:bold;
  margin-top:8px;
}

#dailyHistory{
  margin-top:10px;
}
    @media print{

    @page{
        size:A4 portrait;
        margin:8mm;
    }

    body *{
        visibility:hidden;
    }

    #printArea,
    #printArea *{
        visibility:visible;
    }

    #printArea{
        position:absolute;
        left:0;
        top:0;
        width:100%;
    }

.printPage{
    width:195mm;
    height:270mm;
    margin:0;
    padding:5mm;
    box-sizing:border-box;
    page-break-after:always;
    break-after:page;
    overflow:hidden;
    font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
    color:#000;
    display:flex;
    flex-direction:column;
}

    /* タイトル */
    .deliveryTitle{
        text-align:center;
        font-size:32px;
        font-weight:bold;
        margin:0 0 8mm 0;
        letter-spacing:5px;
    }

/* 上部情報 */
.deliveryInfo{
    display:flex;
    flex-direction:column;
    margin-bottom:4mm;
    font-size:14px;
}

/* 店舗名 */
.deliveryStoreLine{
    height:115mm;
    margin-bottom:3mm;
    display:flex;
    align-items:center;
    border-bottom:1px solid #000;
}

.deliveryStoreLine .deliveryLabel{
    width:28mm;
    font-size:20px;
    font-weight:bold;
}

.deliveryStoreLine span:last-child{
    font-size:190px;
    font-weight:bold;
}

/* 日付・七ツ森農業・会員名 */
.deliveryMeta{
    display:flex;
    width:100%;
    align-items:center;
    gap:3mm;
    white-space:nowrap;
}

.deliveryMeta .deliveryLine{
    flex:1;
    height:8mm;
    margin-bottom:2mm;
    display:flex;
    align-items:center;
    border-bottom:1px solid #000;
}

.deliveryMeta .deliveryLabel{
    width:auto;
    margin-right:3mm;
    font-size:20px;
    font-weight:bold;
}

.deliveryMeta .deliveryLine span:last-child{
    font-size:24px;
    font-weight:bold;
}

/* 会員名 */
.deliveryMeta .deliveryLine:last-child span:last-child{
    font-size:24px;
    font-weight:bold;
}

/* 納品文 */
.deliveryMessage{
    font-size:15px;
    margin:4mm 0;
}
/* 商品表 */
.deliveryTable{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    flex:none;
    margin-top:auto;
}

.deliveryTable th,
.deliveryTable td{
    border:1px solid #000;
    padding:1mm 2mm;
    font-size:14px;
    box-sizing:border-box;
}

.deliveryTable th{
    text-align:center;
    font-weight:bold;
    height:12mm;
    font-size:18px;
}

.deliveryTable th:nth-child(1){
    width:50%;
}

.deliveryTable th:nth-child(2){
    width:25%;
}

.deliveryTable th:nth-child(3){
    width:24%;
}

.deliveryTable td.productName{
    text-align:left;
    font-size:28px;
    font-weight:bold;
}

.deliveryTable td.productNumber{
    text-align:center;
}

.deliveryTable td.quantity{
    text-align:center;
    font-weight:bold;
    font-size:24px;
}
.deliveryTable td:nth-child(3){
    font-weight:bold;
    font-size:28px;
    text-align:center;
}

/* 商品5行だけ均等にする */
.deliveryTable tbody tr:not(.deliveryGrandTotal){
    height:18mm;
}

.deliveryTable tbody tr:not(.deliveryGrandTotal) td{
    height:18mm;
}

/* 合計行 */
.deliveryGrandTotal td{
    height:11mm;
    font-weight:bold;
    font-size:16px;
}

.deliveryGrandTotal td:first-child{
    text-align:center;
}
        
</style>


</head>

<body>

<header class="header">

<h1>🥬 野菜出荷管理</h1>

<p class="subTitle">

</header>

<nav class="menu">

</button>

🖨️ A6一括印刷
</button>
</nav>

<main>

<section id="shippingArea">

<h2>

今日の出荷

</h2>

<div class="tableWrap">

<table id="shippingTable">

<thead>

<tr>

<th>商品</th>

<th>単価</th>

<th>予定</th>

<th>合計</th>

<th>わさだ</th>

<th>大在</th>

<th>南大分</th>

<th>本店</th>

<th>竹田</th>

<th>すごう</th>

<th>天神</th>

<th>サンリブ</th>

<th>サンライフ</th>

<th>日出</th>

</tr>

</main>

<footer>

<div id="grandTotal">

総袋数

<span id="grandTotalValue">

0

</span>

</div>
<div id="dailyTotal">

1日の合計金額

<span id="dailyTotalAmount">

0

</span> 円

</div>
 <div id="dailyHistory">

日毎の合計金額

<div class="dailyHistoryHeader">
  <span>日付</span>
  <span>合計金額</span>
</div>

<div id="dailyHistoryList"></div>
<div id="dailyCumulativeTotal">

累計金額

<span id="dailyCumulativeTotalAmount">

0

</span> 円

</div>
</div>
</footer>


<script>
const stores=[
"わさだ","大在","南大分","本店","竹田","すごう",
"天神","サンリブ","サンライフ","道の駅あさじ",
"古国府","光吉","日出","高城","志手",
"高尾","清川","神楽苑"
];

const items=[
{name:"人参",price:180},
{name:"えだまめ",price:200},
{name:"きゅうり",price:180}
];

const tableBody=document.getElementById("tableBody");
const grandTotalValue=document.getElementById("grandTotalValue");
const dailyTotalAmountValue=document.getElementById("dailyTotalAmount");
let dailyTotalAmount=0;    
let dailyTotals={};
let editingDate=null;
const dailyCumulativeTotalAmountValue =
document.getElementById("dailyCumulativeTotalAmount");
function getTodayKey(){

const now=new Date();

return now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");

}
function loadDailyTotals(){

const data=localStorage.getItem("vegetableDailyTotals");

if(data){

dailyTotals=JSON.parse(data);

}

}  
function saveDailyTotal(){

const today=getTodayKey();

const saveDate=editingDate || today;

dailyTotals[saveDate]=dailyTotalAmount;

localStorage.setItem(
"vegetableDailyTotals",
JSON.stringify(dailyTotals)
);

}
function displayDailyTotals(){

const list=document.getElementById("dailyHistoryList");

list.innerHTML="";
let cumulative=0;

const dates=Object.keys(dailyTotals).sort().reverse();

dates.forEach(date=>{

const div=document.createElement("div");

div.className="dailyHistoryRow";

const amountSpan=document.createElement("span");

amountSpan.textContent=
Number(dailyTotals[date]).toLocaleString()+" 円";

const deleteButton=document.createElement("button");

deleteButton.textContent="削除";

deleteButton.addEventListener("click",()=>{

if(!confirm(date+" のデータを削除します。\nよろしいですか？")){
return;
}

delete dailyTotals[date];

localStorage.setItem(
"vegetableDailyTotals",
JSON.stringify(dailyTotals)
);

displayDailyTotals();

});

const dateSpan=document.createElement("span");

dateSpan.textContent=date;

dateSpan.style.cursor="pointer";
dateSpan.style.textDecoration="underline";

div.appendChild(dateSpan);
dateSpan.addEventListener("click",()=>{
editingDate=date;
const dailyShippingData=JSON.parse(
localStorage.getItem("vegetableDailyShippingData")
) || {};

const data=dailyShippingData[date];

if(!data){

alert("この日の出荷データは保存されていません。");

return;

}

const rows=tableBody.querySelectorAll("tr");

rows.forEach((row,rowIndex)=>{

const inputs=row.querySelectorAll("input");

inputs.forEach((input,colIndex)=>{

if(data[rowIndex] && data[rowIndex][colIndex]!=null){

input.value=data[rowIndex][colIndex];

}

});

});

recalc();

alert(date+" の出荷データを読み込みました");

});

div.appendChild(amountSpan);

div.appendChild(deleteButton);

list.appendChild(div);

});

}    
function createTable(){

tableBody.innerHTML="";

items.forEach(item=>{

const tr=document.createElement("tr");

let html="";

html+=`<td>${item.name}</td>`;

html+=`<td>${item.price}</td>`;

html+=`<td class="plan">0</td>`;

html+=`<td class="total">0</td>`;

stores.forEach(()=>{

html+=`<td>
<input type="number"
value="0"
min="0"
inputmode="none">
</td>`;

});

tr.innerHTML=html;

tableBody.appendChild(tr);

});
}
  function recalc(){

let grand=0;
dailyTotalAmount=0;
const rows=tableBody.querySelectorAll("tr");

rows.forEach(row=>{

const inputs=row.querySelectorAll("input");

let sum=0;

inputs.forEach(input=>{
sum+=Number(input.value)||0;
});
dailyTotalAmount+=sum*Number(row.children[1].textContent);
row.querySelector(".plan").textContent=sum;
row.querySelector(".total").textContent=sum;

grand+=sum;

});

grandTotalValue.textContent=grand;
dailyTotalAmountValue.textContent=dailyTotalAmount.toLocaleString();
}

tableBody.addEventListener("input",recalc);

function saveData(){

const data=[];

tableBody.querySelectorAll("tr").forEach(row=>{

const rowData=[];

row.querySelectorAll("input").forEach(input=>{

rowData.push(Number(input.value)||0);

});

data.push(rowData);

});

localStorage.setItem(
"vegetableShippingData",
JSON.stringify(data)
);

}
function saveDailyShippingData(){

const today=getTodayKey();


const saveDate=editingDate || today;
const data=[];

tableBody.querySelectorAll("tr").forEach(row=>{

const rowData=[];

row.querySelectorAll("input").forEach(input=>{

rowData.push(Number(input.value)||0);

});

data.push(rowData);

});

let dailyShippingData=JSON.parse(
localStorage.getItem("vegetableDailyShippingData")
) || {};

dailyShippingData[saveDate]=data;

localStorage.setItem(
"vegetableDailyShippingData",
JSON.stringify(dailyShippingData)
);

}
function loadData(){

const data=JSON.parse(
localStorage.getItem("vegetableShippingData")
);

if(!data)return;

const rows=tableBody.querySelectorAll("tr");

rows.forEach((row,rowIndex)=>{

const inputs=row.querySelectorAll("input");

inputs.forEach((input,colIndex)=>{

if(data[rowIndex] && data[rowIndex][colIndex]!=null){

input.value=data[rowIndex][colIndex];

}

});



recalc();
});
} 
document.getElementById("btnSave")
.addEventListener("click",()=>{

saveData();
saveDailyShippingData();
saveDailyTotal();
displayDailyTotals();
editingDate=null;
alert("保存しました");

});

document.getElementById("btnLoad")
.addEventListener("click",()=>{

    loadData();

    alert("読み込みました");

});


document.getElementById("btnClear")
.addEventListener("click",()=>{

    if(!confirm("入力したデータをすべて削除します。\nよろしいですか？")){
        return;
    }

    document
    .querySelectorAll("input[type='number']")
    .forEach(input=>{
        input.value=0;
    });

    recalc();

    localStorage.removeItem("vegetableShippingData");

    alert("データを削除しました");

});

createTable();
loadData();
loadDailyTotals();
displayDailyTotals();    
recalc();
function printA6(){

  const table=document.getElementById("shippingTable");

  if(!table){
    alert("出荷表が見つかりません");
    return;
  }

  const printArea=document.createElement("div");
  printArea.id="printArea";

  const headers=table.querySelectorAll("thead th");
  const rows=table.querySelectorAll("tbody tr");

  /* 店舗ごとにページを作る */
  for(let col=4;col<headers.length;col++){

    const storeName=headers[col].textContent.trim();

    if(!storeName) continue;

    const itemsForStore=[];

    let storeTotal=0;

    rows.forEach(row=>{

      const cells=row.querySelectorAll("td");

      if(cells.length<=col) return;

      const product=cells[0].textContent.trim();

      /* 単価 */
      const price=Number(cells[1].textContent.trim())||0;

      const input=cells[col].querySelector("input");

      if(!input) return;

      const quantity=Number(input.value)||0;

      /* 0袋の商品は印刷しない */
      if(quantity<=0) return;

      const amount=quantity*price;

      storeTotal+=amount;

      itemsForStore.push({
        product:product,
        quantity:quantity,
        price:price,
        amount:amount
      });

    });

    /* 商品がない店舗は印刷しない */
    if(itemsForStore.length===0) continue;

    /* ページ */
    const page=document.createElement("div");
    page.className="printPage";

    /* タイトル */
    const title=document.createElement("h2");
    title.className="deliveryTitle";
    title.textContent="納　品　書";
    page.appendChild(title);

/* 上部情報 */
const info=document.createElement("div");
info.className="deliveryInfo";

/* 店舗名 */
const destination=document.createElement("div");
destination.className="deliveryLine deliveryStoreLine";
destination.innerHTML=
  '<span class="deliveryLabel">出荷先：</span>'+
  '<span>'+storeName+'</span>';

info.appendChild(destination);

/* 日付・七ツ森農業・会員名 */
const metaRow=document.createElement("div");
metaRow.className="deliveryMeta";

/* 日付 */
const dateLine=document.createElement("div");
dateLine.className="deliveryLine";

const today=new Date();

const year=today.getFullYear();
const month=today.getMonth()+1;
const day=today.getDate();

dateLine.innerHTML=
  '<span class="deliveryLabel">年月日：</span>'+
  '<span>'+year+'年　'+month+'月　'+day+'日</span>';

metaRow.appendChild(dateLine);

/* 七ツ森農業 */
const groupLine=document.createElement("div");
groupLine.className="deliveryLine";
groupLine.innerHTML=
  '<span>七ツ森農業</span>';

metaRow.appendChild(groupLine);

/* 会員名 */
const memberName=document.createElement("div");
memberName.className="deliveryLine";
memberName.innerHTML=
  '<span class="deliveryLabel">会員名</span>'+
  '<span>佐藤利彦</span>';

metaRow.appendChild(memberName);

page.appendChild(info);
page.appendChild(metaRow);
    /* 納品文 */
    const message=document.createElement("div");
    message.className="deliveryMessage";
    message.textContent="下記のとおり納品いたしました";
    page.appendChild(message);
　　
 

    /* 商品表 */
    const deliveryTable=document.createElement("table");
    deliveryTable.className="deliveryTable";

    const thead=document.createElement("thead");
    const headerRow=document.createElement("tr");

    ["品　名","数量","単価(税抜)"]
      .forEach(text=>{
        const th=document.createElement("th");
        th.textContent=text;
        headerRow.appendChild(th);
      });

    thead.appendChild(headerRow);
    deliveryTable.appendChild(thead);

    const tbody=document.createElement("tbody");

    /* 商品 */
    itemsForStore.forEach(item=>{

      const tr=document.createElement("tr");

      const productTd=document.createElement("td");
      productTd.className="productName";
      productTd.textContent=item.product;

      

      const quantityTd=document.createElement("td");
      quantityTd.className="quantity";
      quantityTd.textContent=item.quantity+"袋";

      const priceTd=document.createElement("td");
      priceTd.textContent=
        item.price.toLocaleString()+"円";

      

      tr.appendChild(productTd);
     
      tr.appendChild(quantityTd);
      tr.appendChild(priceTd);
      

      tbody.appendChild(tr);

    });

    /* 空白行を追加 */
    const blankRows=Math.max(0,5-itemsForStore.length);

    for(let i=0;i<blankRows;i++){

      const tr=document.createElement("tr");

      for(let j=0;j<3;j++){
        const td=document.createElement("td");

        if(j===0){
          td.className="productName";
        }

        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    }

    

    deliveryTable.appendChild(tbody);

    page.appendChild(deliveryTable);

    printArea.appendChild(page);

  }

  /* 印刷する店舗がない場合 */
  if(printArea.children.length===0){
    alert("印刷する出荷データがありません");
    return;
      
  }

  document.body.appendChild(printArea);

  window.addEventListener("afterprint",()=>{
    printArea.remove();
  },{once:true});

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.print();
    });
  });

}

document.getElementById("btnPrintA6")
.addEventListener("click",()=>{
    printA6();
});
 /* 10キー用：現在選択している入力欄 */
let activeInput = null;

tableBody.addEventListener("focusin",(event)=>{
    if(event.target.matches('input[type="number"]')){
        activeInput = event.target;
    }
});
  
</script>
<!-- 10キー -->
<div id="numPad">

<div class="keyArea">

  <div class="numRow">
    <button class="numKey">1</button>
    <button class="numKey">2</button>
    <button class="numKey">3</button>
    <button class="numKey">⌫</button>
  </div>

  <div class="numRow">
    <button class="numKey">4</button>
    <button class="numKey">5</button>
    <button class="numKey">6</button>
    <button class="numKey">C</button>
  </div>

  <div class="numRow">
    <button class="numKey">7</button>
    <button class="numKey">8</button>
    <button class="numKey">9</button>
    <button class="numKey">0</button>
  </div>
</div>

<button class="numKey direction enterKey">Enter</button>

<div class="directionArea">

  <button class="numKey direction">↑</button>
  <button class="numKey direction">←</button>
  <button class="numKey direction">↓</button>

</div>

</div>
    
<script>

/* 10キーの数字入力 */
document.querySelectorAll("#numPad .numKey").forEach(button=>{

    button.addEventListener("click",()=>{

        const value=button.textContent;

        if(!/^[0-9]$/.test(value)) return;

        if(!activeInput) return;

        if(activeInput.value==="0"){
    activeInput.value=value;
}else{
    activeInput.value+=value;
}

activeInput.dispatchEvent(new Event("input",{bubbles:true}));

    });

});
    /* 10キーのCボタン */
document.querySelectorAll("#numPad .numKey").forEach(button=>{

    if(button.textContent!=="C") return;

    button.addEventListener("click",()=>{

        if(!activeInput) return;

        activeInput.value="0";

        activeInput.dispatchEvent(
            new Event("input",{bubbles:true})
        );

    });

});
    /* 10キーの1桁削除 */
document.querySelectorAll("#numPad .numKey").forEach(button=>{

    if(button.textContent!=="⌫") return;

    button.addEventListener("click",()=>{

        if(!activeInput) return;

        let value=activeInput.value;

        if(value.length<=1){
            activeInput.value="0";
        }else{
            activeInput.value=value.slice(0,-1);
        }

        activeInput.dispatchEvent(
            new Event("input",{bubbles:true})
        );

    });

});
/* 10キーの十字キー */
document.querySelectorAll("#numPad .direction").forEach(button=>{

    button.addEventListener("click",()=>{

        if(!activeInput) return;

        const inputs=[
            ...tableBody.querySelectorAll('input[type="number"]')
        ];

        const index=inputs.indexOf(activeInput);

        if(index===-1) return;

        let nextIndex=index;

        if(button.textContent==="Enter"){
            nextIndex=index+1;
        }

        if(button.textContent==="←"){
            nextIndex=index-1;
        }

        if(button.textContent==="↓"){
            nextIndex=index+stores.length;
        }

        if(button.textContent==="↑"){
            nextIndex=index-stores.length;
        }

        if(nextIndex<0) return;
        if(nextIndex>=inputs.length) return;

        inputs[nextIndex].focus();

        activeInput=inputs[nextIndex];

    });

});
</script>
