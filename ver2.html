<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>野菜出荷管理 Ver1</title>
<style>

body{
margin:0;
padding:12px;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#f3f6fa;
color:#222;
}

.header{
background:#2e7d32;
color:#fff;
padding:15px;
border-radius:10px;
text-align:center;
margin-bottom:15px;
}

.subTitle{
margin:5px 0 0;
font-size:13px;
}

.menu{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:15px;
}

.menu button{

background:#43a047;
color:white;
border:none;
border-radius:8px;
padding:10px 16px;
font-size:15px;
white-space:nowrap;

}

.tableWrap{

overflow:auto;
background:white;
border-radius:10px;
padding:10px;

box-shadow:0 2px 6px rgba(0,0,0,.1);

}

table{

border-collapse:collapse;
width:max-content;

}

th{

background:#4caf50;
color:white;
padding:8px;
border:1px solid #ddd;

}

td{

border:1px solid #ddd;
padding:5px;

}

input[type=number]{

width:55px;
padding:5px;
text-align:center;

}

footer{

margin-top:20px;

background:white;

padding:15px;

border-radius:10px;

font-size:22px;

font-weight:bold;

text-align:center;

box-shadow:0 2px 6px rgba(0,0,0,.1);

}
@media print{

    @page{
        size:A6 portrait;
        margin:8mm;
    }

    body *{
        visibility:hidden;
    }

    #printArea,
    #printArea *{
        visibility:visible;
    }

    #printArea{
        position:absolute;
        left:0;
        top:0;
        width:100%;
    }

    .a6Page{
        width:100%;
        min-height:120mm;
        page-break-after:always;
        box-sizing:border-box;
    }

    .a6Page h2{
        text-align:center;
        margin:0 0 8mm 0;
        font-size:20px;
    }

    .a6Page h3{
        margin:0 0 6mm 0;
        font-size:16px;
    }

    .printItem{
        font-size:15px;
        padding:3mm 0;
        border-bottom:1px solid #000;
    }

}
</style>


</head>

<body>

<header class="header">

<h1>🥬 野菜出荷管理</h1>

<p class="subTitle">
GitHub Pages版
</p>

</header>

<nav class="menu">

<button id="btnInput">
出荷入力
</button>

<button id="btnPrint">
納品書
</button>

<button id="btnSave">
保存
</button>

<button id="btnLoad">
読込
</button>

<button id="btnClear">
クリア
</button>
<button id="btnPrintA6">
🖨️ A6一括印刷
</button>
</nav>

<main>

<section id="shippingArea">

<h2>

今日の出荷

</h2>

<div class="tableWrap">

<table id="shippingTable">

<thead>

<tr>

<th>商品</th>

<th>単価</th>

<th>予定</th>

<th>合計</th>

<th>わさだ</th>

<th>大在</th>

<th>南大分</th>

<th>本店</th>

<th>竹田</th>

<th>すごう</th>

<th>天神</th>

<th>サンリブ</th>

<th>サンライフ</th>

<th>道の駅</th>

<th>古国府</th>

<th>光吉</th>

<th>日出</th>

<th>高城</th>

<th>志手</th>

<th>高尾</th>

<th>清川</th>

<th>神楽苑</th>

</tr>

</thead>

<tbody id="tableBody">

<!-- app.js が自動生成 -->

</tbody>

</table>

</div>

</section>

</main>

<footer>

<div id="grandTotal">

総袋数

<span id="grandTotalValue">

0

</span>

</div>

</footer>


<script>
const stores=[
"わさだ","大在","南大分","本店","竹田","すごう",
"天神","サンリブ","サンライフ","道の駅",
"古国府","光吉","日出","高城","志手",
"高尾","清川","神楽苑"
];

const items=[
{name:"白ねぎ",price:180},
{name:"小ねぎ",price:150},
{name:"にら",price:130},
{name:"ほうれん草",price:180},
{name:"水菜",price:150},
{name:"春菊",price:180},
{name:"チンゲンサイ",price:150},
{name:"小松菜",price:150},
{name:"レタス",price:180},
{name:"サニーレタス",price:180},
{name:"キャベツ",price:200},
{name:"白菜",price:250},
{name:"きゅうり",price:180},
{name:"トマト",price:250},
{name:"ミニトマト",price:200},
{name:"ピーマン",price:180},
{name:"なす",price:180},
{name:"オクラ",price:180},
{name:"かぼちゃ",price:350},
{name:"大根",price:180},
{name:"人参",price:180},
{name:"玉ねぎ",price:180},
{name:"じゃがいも",price:180},
{name:"さつまいも",price:250}
];

const tableBody=document.getElementById("tableBody");
const grandTotalValue=document.getElementById("grandTotalValue");
function createTable(){

tableBody.innerHTML="";

items.forEach(item=>{

const tr=document.createElement("tr");

let html="";

html+=`<td>${item.name}</td>`;

html+=`<td>${item.price}</td>`;

html+=`<td class="plan">0</td>`;

html+=`<td class="total">0</td>`;

stores.forEach(()=>{

html+=`<td>
<input type="number"
value="0"
min="0">
</td>`;

});

tr.innerHTML=html;

tableBody.appendChild(tr);

});

}
  function recalc(){

let grand=0;

const rows=tableBody.querySelectorAll("tr");

rows.forEach(row=>{

const inputs=row.querySelectorAll("input");

let sum=0;

inputs.forEach(input=>{
sum+=Number(input.value)||0;
});

row.querySelector(".plan").textContent=sum;
row.querySelector(".total").textContent=sum;

grand+=sum;

});

grandTotalValue.textContent=grand;

}

tableBody.addEventListener("input",recalc);

function saveData(){

const data=[];

tableBody.querySelectorAll("tr").forEach(row=>{

const rowData=[];

row.querySelectorAll("input").forEach(input=>{

rowData.push(Number(input.value)||0);

});

data.push(rowData);

});

localStorage.setItem(
"vegetableShippingData",
JSON.stringify(data)
);

}

function loadData(){

const data=JSON.parse(
localStorage.getItem("vegetableShippingData")
);

if(!data)return;

const rows=tableBody.querySelectorAll("tr");

rows.forEach((row,rowIndex)=>{

const inputs=row.querySelectorAll("input");

inputs.forEach((input,colIndex)=>{

if(data[rowIndex] && data[rowIndex][colIndex]!=null){

input.value=data[rowIndex][colIndex];

}

});

});

recalc();

}

document.getElementById("btnSave")
.addEventListener("click",()=>{

saveData();

alert("保存しました");

});

document.getElementById("btnLoad")
.addEventListener("click",()=>{

    loadData();

    alert("読み込みました");

});


document.getElementById("btnClear")
.addEventListener("click",()=>{

    if(!confirm("入力したデータをすべて削除します。\nよろしいですか？")){
        return;
    }

    document
    .querySelectorAll("input[type='number']")
    .forEach(input=>{
        input.value=0;
    });

    recalc();

    localStorage.removeItem("vegetableShippingData");

    alert("データを削除しました");

});
});
createTable();
loadData();
recalc();
function printA6(){

    const table=document.getElementById("shippingTable");

    if(!table){
        alert("出荷表が見つかりません");
        return;
    }

    const printArea=document.createElement("div");
    printArea.id="printArea";

    const headers=table.querySelectorAll("thead th");
    const rows=table.querySelectorAll("tbody tr");

    for(let col=2;col<headers.length;col++){

        const storeName=headers[col].textContent.trim();

        if(!storeName) continue;

        const page=document.createElement("div");
        page.className="a6Page";

        const title=document.createElement("h2");
        title.textContent="本日の出荷";
        page.appendChild(title);

        const store=document.createElement("h3");
        store.textContent="店舗： "+storeName;
        page.appendChild(store);

        const list=document.createElement("div");
        list.className="printList";

        rows.forEach(row=>{

            const cells=row.querySelectorAll("td");

            if(cells.length<=col) return;

            const product=cells[0].textContent.trim();
            const input=cells[col].querySelector("input");

            if(!input) return;

            const quantity=Number(input.value)||0;

            if(quantity>0){

                const item=document.createElement("div");
                item.className="printItem";

                item.textContent=product+"　"+quantity+"袋";

                list.appendChild(item);
            }

        });

        page.appendChild(list);
        printArea.appendChild(page);
    }

    document.body.appendChild(printArea);

    window.print();

}


document.getElementById("btnPrintA6")
.addEventListener("click",()=>{

    printA6();

});
</script>
</body>

</html>
