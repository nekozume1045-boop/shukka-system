<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>野菜出荷管理 Ver1</title>
<style>

body{
margin:0;
padding:12px;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#f3f6fa;
color:#222;
}

.header{
background:#2e7d32;
color:#fff;
padding:15px;
border-radius:10px;
text-align:center;
margin-bottom:15px;
}

.subTitle{
margin:5px 0 0;
font-size:13px;
}

.menu{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:15px;
}

.menu button{

background:#43a047;
color:white;
border:none;
border-radius:8px;
padding:10px 16px;
font-size:15px;
white-space:nowrap;

}

.tableWrap{

overflow:auto;
background:white;
border-radius:10px;
padding:10px;

box-shadow:0 2px 6px rgba(0,0,0,.1);

}

table{

border-collapse:collapse;
width:max-content;

}

th{

background:#4caf50;
color:white;
padding:8px;
border:1px solid #ddd;

}

td{

border:1px solid #ddd;
padding:5px;

}

input[type=number]{

width:55px;
padding:5px;
text-align:center;

}

footer{

margin-top:20px;

background:white;

padding:15px;

border-radius:10px;

font-size:22px;

font-weight:bold;

text-align:center;

box-shadow:0 2px 6px rgba(0,0,0,.1);

}
#printArea {

    visibility:hidden;

    position:absolute;

    left:0;

    top:0;

    width:100%;

}
    @media print{

    @page{
        size:A4 portrait;
        margin:8mm;
    }

    body *{
        visibility:hidden;
    }

    #printArea,
    #printArea *{
        visibility:visible;
    }

    #printArea{
        position:absolute;
        left:0;
        top:0;
        width:100%;
    }

.printPage{
    width:194mm;
    height:279mm;
    margin:0;
    padding:5mm;
    box-sizing:border-box;
    page-break-after:always;
    break-after:page;
    overflow:hidden;
    font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
    color:#000;
    display:flex;
    flex-direction:column;
}

    /* タイトル */
    .deliveryTitle{
        text-align:center;
        font-size:24px;
        font-weight:bold;
        margin:0 0 8mm 0;
        letter-spacing:5px;
    }

    /* 上部情報 */
    .deliveryInfo{
        display:flex;
        justify-content:space-between;
        margin-bottom:4mm;
        font-size:14px;
    }

    .deliveryLeft{
        width:55%;
    }

    .deliveryRight{
        width:40%;
    }

    .deliveryLine{
    height:8mm;
    border-bottom:1px solid #000;
    margin-bottom:2mm;
    display:flex;
    align-items:center;
}

.deliveryLine:first-child span:last-child{
    font-size:24px;
    font-weight:bold;
}

    .deliveryLabel{
        width:28mm;
        font-weight:bold;
    }

    /* 納品文 */
    .deliveryMessage{
        font-size:15px;
        margin:4mm 0;
    }

    /* 合計金額 */
    .deliveryTotalBox{
        display:flex;
        width:90mm;
        height:13mm;
        border:1px solid #000;
        margin-bottom:5mm;
    }

    .deliveryTotalLabel{
        width:30mm;
        display:flex;
        align-items:center;
        justify-content:center;
        border-right:1px solid #000;
        font-weight:bold;
    }

    .deliveryTotalValue{
        flex:1;
        display:flex;
        align-items:center;
        justify-content:flex-end;
        padding-right:4mm;
        font-size:18px;
        font-weight:bold;
    }

/* 商品表 */
.deliveryTable{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    flex:none;
}

.deliveryTable th,
.deliveryTable td{
    border:1px solid #000;
    padding:1mm 2mm;
    font-size:14px;
    box-sizing:border-box;
}

.deliveryTable th{
    text-align:center;
    font-weight:bold;
    height:12mm;
}

.deliveryTable th:nth-child(1){
    width:38%;
}

.deliveryTable th:nth-child(2){
    width:17%;
}

.deliveryTable th:nth-child(3){
    width:13%;
}

.deliveryTable th:nth-child(4){
    width:14%;
}

.deliveryTable th:nth-child(5){
    width:18%;
}

.deliveryTable td.productName{
    text-align:left;
    font-size:24px;
    font-weight:bold;
}

.deliveryTable td.productNumber{
    text-align:center;
}

.deliveryTable td.quantity{
    text-align:center;
    font-weight:bold;
    font-size:18px;
}

.deliveryTable td:nth-child(4),
.deliveryTable td:nth-child(5){
    font-weight:bold;
    font-size:18px;
}
/* 商品9行だけ均等にする */
.deliveryTable tbody tr:not(.deliveryGrandTotal){
    height:15mm;
}

.deliveryTable tbody tr:not(.deliveryGrandTotal) td{
    height:15mm;
}

/* 合計行 */
.deliveryGrandTotal td{
    height:11mm;
    font-weight:bold;
    font-size:16px;
}

.deliveryGrandTotal td:first-child{
    text-align:center;
}

</style>


</head>

<body>

<header class="header">

<h1>🥬 野菜出荷管理</h1>

<p class="subTitle">
GitHub Pages版
</p>

</header>

<nav class="menu">

<button id="btnInput">
出荷入力
</button>

<button id="btnPrint">
納品書
</button>

<button id="btnSave">
保存
</button>

<button id="btnLoad">
読込
</button>

<button id="btnClear">
クリア
</button>
<button id="btnPrintA6">
🖨️ A6一括印刷
</button>
</nav>

<main>

<section id="shippingArea">

<h2>

今日の出荷

</h2>

<div class="tableWrap">

<table id="shippingTable">

<thead>

<tr>

<th>商品</th>

<th>単価</th>

<th>予定</th>

<th>合計</th>

<th>わさだ</th>

<th>大在</th>

<th>南大分</th>

<th>本店</th>

<th>竹田</th>

<th>すごう</th>

<th>天神</th>

<th>サンリブ</th>

<th>サンライフ</th>

<th>道の駅</th>

<th>古国府</th>

<th>光吉</th>

<th>日出</th>

<th>高城</th>

<th>志手</th>

<th>高尾</th>

<th>清川</th>

<th>神楽苑</th>

</tr>

</thead>

<tbody id="tableBody">

<!-- app.js が自動生成 -->

</tbody>

</table>

</div>

</section>

</main>

<footer>

<div id="grandTotal">

総袋数

<span id="grandTotalValue">

0

</span>

</div>

</footer>


<script>
const stores=[
"わさだ","大在","南大分","本店","竹田","すごう",
"天神","サンリブ","サンライフ","道の駅",
"古国府","光吉","日出","高城","志手",
"高尾","清川","神楽苑"
];

const items=[
{name:"人参",price:180},
{name:"えだまめ",price:200},
{name:"きゅうり",price:180}
];

const tableBody=document.getElementById("tableBody");
const grandTotalValue=document.getElementById("grandTotalValue");
function createTable(){

tableBody.innerHTML="";

items.forEach(item=>{

const tr=document.createElement("tr");

let html="";

html+=`<td>${item.name}</td>`;

html+=`<td>${item.price}</td>`;

html+=`<td class="plan">0</td>`;

html+=`<td class="total">0</td>`;

stores.forEach(()=>{

html+=`<td>
<input type="number"
value="0"
min="0">
</td>`;

});

tr.innerHTML=html;

tableBody.appendChild(tr);

});
}
  function recalc(){

let grand=0;

const rows=tableBody.querySelectorAll("tr");

rows.forEach(row=>{

const inputs=row.querySelectorAll("input");

let sum=0;

inputs.forEach(input=>{
sum+=Number(input.value)||0;
});

row.querySelector(".plan").textContent=sum;
row.querySelector(".total").textContent=sum;

grand+=sum;

});

grandTotalValue.textContent=grand;

}

tableBody.addEventListener("input",recalc);

function saveData(){

const data=[];

tableBody.querySelectorAll("tr").forEach(row=>{

const rowData=[];

row.querySelectorAll("input").forEach(input=>{

rowData.push(Number(input.value)||0);

});

data.push(rowData);

});

localStorage.setItem(
"vegetableShippingData",
JSON.stringify(data)
);

}

function loadData(){

const data=JSON.parse(
localStorage.getItem("vegetableShippingData")
);

if(!data)return;

const rows=tableBody.querySelectorAll("tr");

rows.forEach((row,rowIndex)=>{

const inputs=row.querySelectorAll("input");

inputs.forEach((input,colIndex)=>{

if(data[rowIndex] && data[rowIndex][colIndex]!=null){

input.value=data[rowIndex][colIndex];

}

});



recalc();
});
} 
document.getElementById("btnSave")
.addEventListener("click",()=>{

saveData();

alert("保存しました");

});

document.getElementById("btnLoad")
.addEventListener("click",()=>{

    loadData();

    alert("読み込みました");

});


document.getElementById("btnClear")
.addEventListener("click",()=>{

    if(!confirm("入力したデータをすべて削除します。\nよろしいですか？")){
        return;
    }

    document
    .querySelectorAll("input[type='number']")
    .forEach(input=>{
        input.value=0;
    });

    recalc();

    localStorage.removeItem("vegetableShippingData");

    alert("データを削除しました");

});

createTable();
loadData();
recalc();
function printA6(){

  const table=document.getElementById("shippingTable");

  if(!table){
    alert("出荷表が見つかりません");
    return;
  }

  const printArea=document.createElement("div");
  printArea.id="printArea";

  const headers=table.querySelectorAll("thead th");
  const rows=table.querySelectorAll("tbody tr");

  /* 店舗ごとにページを作る */
  for(let col=4;col<headers.length;col++){

    const storeName=headers[col].textContent.trim();

    if(!storeName) continue;

    const itemsForStore=[];

    let storeTotal=0;

    rows.forEach(row=>{

      const cells=row.querySelectorAll("td");

      if(cells.length<=col) return;

      const product=cells[0].textContent.trim();

      /* 単価 */
      const price=Number(cells[1].textContent.trim())||0;

      const input=cells[col].querySelector("input");

      if(!input) return;

      const quantity=Number(input.value)||0;

      /* 0袋の商品は印刷しない */
      if(quantity<=0) return;

      const amount=quantity*price;

      storeTotal+=amount;

      itemsForStore.push({
        product:product,
        quantity:quantity,
        price:price,
        amount:amount
      });

    });

    /* 商品がない店舗は印刷しない */
    if(itemsForStore.length===0) continue;

    /* ページ */
    const page=document.createElement("div");
    page.className="printPage";

    /* タイトル */
    const title=document.createElement("h2");
    title.className="deliveryTitle";
    title.textContent="納　品　書";
    page.appendChild(title);

    /* 上部情報 */
    const info=document.createElement("div");
    info.className="deliveryInfo";

    const left=document.createElement("div");
    left.className="deliveryLeft";

    /* 出荷先 */
    const destination=document.createElement("div");
    destination.className="deliveryLine";
    destination.innerHTML=
      '<span class="deliveryLabel">出荷先：</span>'+
      '<span>'+storeName+'</span>';
    left.appendChild(destination);

    /* 日付 */
    const dateLine=document.createElement("div");
    dateLine.className="deliveryLine";

    const today=new Date();

    const year=today.getFullYear();
    const month=today.getMonth()+1;
    const day=today.getDate();

    dateLine.innerHTML=
      '<span class="deliveryLabel">年月日：</span>'+
      '<span>'+year+'年　'+month+'月　'+day+'日</span>';

    left.appendChild(dateLine);

    info.appendChild(left);

    const right=document.createElement("div");
    right.className="deliveryRight";

    /* 会員番号 */
    const memberNumber=document.createElement("div");
    memberNumber.className="deliveryLine";
    memberNumber.innerHTML=
      '<span class="deliveryLabel">会員番号</span>';

    right.appendChild(memberNumber);

    /* 会員名 */
    const memberName=document.createElement("div");
    memberName.className="deliveryLine";
    memberName.innerHTML=
      '<span class="deliveryLabel">会員名</span>';

    right.appendChild(memberName);

    info.appendChild(right);

    page.appendChild(info);

    /* 納品文 */
    const message=document.createElement("div");
    message.className="deliveryMessage";
    message.textContent="下記のとおり納品いたしました";
    page.appendChild(message);

    /* 合計金額 */
    const totalBox=document.createElement("div");
    totalBox.className="deliveryTotalBox";

    const totalLabel=document.createElement("div");
    totalLabel.className="deliveryTotalLabel";
    totalLabel.textContent="合計金額";

    const totalValue=document.createElement("div");
    totalValue.className="deliveryTotalValue";
    totalValue.textContent=
      storeTotal.toLocaleString()+"円";

    totalBox.appendChild(totalLabel);
    totalBox.appendChild(totalValue);

    page.appendChild(totalBox);

    /* 商品表 */
    const deliveryTable=document.createElement("table");
    deliveryTable.className="deliveryTable";

    const thead=document.createElement("thead");
    const headerRow=document.createElement("tr");

    ["品　名","商品番号","数量","単価","金額（税抜）"]
      .forEach(text=>{
        const th=document.createElement("th");
        th.textContent=text;
        headerRow.appendChild(th);
      });

    thead.appendChild(headerRow);
    deliveryTable.appendChild(thead);

    const tbody=document.createElement("tbody");

    /* 商品 */
    itemsForStore.forEach(item=>{

      const tr=document.createElement("tr");

      const productTd=document.createElement("td");
      productTd.className="productName";
      productTd.textContent=item.product;

      const numberTd=document.createElement("td");
      numberTd.className="productNumber";
      numberTd.textContent="";

      const quantityTd=document.createElement("td");
      quantityTd.className="quantity";
      quantityTd.textContent=item.quantity+"袋";

      const priceTd=document.createElement("td");
      priceTd.textContent=
        item.price.toLocaleString()+"円";

      const amountTd=document.createElement("td");
      amountTd.textContent=
        item.amount.toLocaleString()+"円";

      tr.appendChild(productTd);
      tr.appendChild(numberTd);
      tr.appendChild(quantityTd);
      tr.appendChild(priceTd);
      tr.appendChild(amountTd);

      tbody.appendChild(tr);

    });

    /* 空白行を追加 */
    const blankRows=Math.max(0,9-itemsForStore.length);

    for(let i=0;i<blankRows;i++){

      const tr=document.createElement("tr");

      for(let j=0;j<5;j++){
        const td=document.createElement("td");

        if(j===0){
          td.className="productName";
        }

        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    }

    /* 合計行 */
    const totalRow=document.createElement("tr");
    totalRow.className="deliveryGrandTotal";

    const totalName=document.createElement("td");
    totalName.colSpan=4;
    totalName.textContent="合　計";

    const totalAmount=document.createElement("td");
    totalAmount.textContent=
      storeTotal.toLocaleString()+"円";

    totalRow.appendChild(totalName);
    totalRow.appendChild(totalAmount);

    tbody.appendChild(totalRow);

    deliveryTable.appendChild(tbody);

    page.appendChild(deliveryTable);

    printArea.appendChild(page);

  }

  /* 印刷する店舗がない場合 */
  if(printArea.children.length===0){
    alert("印刷する出荷データがありません");
    return;
  }

  document.body.appendChild(printArea);

  window.addEventListener("afterprint",()=>{
    printArea.remove();
  },{once:true});

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.print();
    });
  });

}

document.getElementById("btnPrintA6")
.addEventListener("click",()=>{
    printA6();
});
</script>
</body>

</html>
